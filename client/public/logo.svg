<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="grad-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer background (simulates 1px border) -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#grad-outer)" />
  
  <!-- Inner gradient box -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#grad-inner)" />

  <!-- Waveform group -->
  <g fill="#ffffff">
    <!-- Bar 1 -->
    <rect x="136" y="216" width="48" height="128" rx="24" fill-opacity="0.9" />
    <!-- Bar 2 -->
    <rect x="216" y="144" width="48" height="272" rx="24" fill-opacity="0.9" />
    <!-- Bar 3 (Main tall bar with glow) -->
    <rect x="296" y="80" width="48" height="384" rx="24" filter="url(#glow)" />
    <!-- Bar 4 -->
    <rect x="376" y="184" width="48" height="192" rx="24" fill-opacity="0.9" />
  </g>
</svg>

version: '3.8'

services:
  app:
    container_name: dance-app
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    ports:
      - "3002:5000"
    networks:
      - default
      - main-network
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=5000
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads

  db:
    container_name: dance-db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_seguro_db_local
      POSTGRES_DB: wrdance
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  # Volume nomeado para uploads: sobrevive a rebuilds e deployments.
  # Os arquivos ficam em /var/lib/docker/volumes/wr-dance-app_uploads_data/_data/
  uploads_data:

networks:
  main-network:
    name: wr-music-app_default
    external: true


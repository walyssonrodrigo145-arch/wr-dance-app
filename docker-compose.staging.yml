version: '3.8'

services:
  app-staging:
    build: .
    container_name: wr-music-app-staging-app
    ports:
      - "3001:3000"
    networks:
      - default
      - main-network
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped

networks:
  main-network:
    name: wr-music-app_default
    external: true
